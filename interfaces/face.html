<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.I.L.O</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eyes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .eye {
      width: 100px;
      height: 100px;
      background-color: black;
      border-radius: 50%;
      margin: 0 65px;
      animation: blink 3s infinite;   
    }
 
    .eyes-container::after {
      content: '';
      position: absolute;
      width: 225px;
      height: 10px;
      background-color: black;
      z-index: -1;
    }
 
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
  </style>
</head>
<body>
  <div class="eyes-container">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
</body>
</html>
